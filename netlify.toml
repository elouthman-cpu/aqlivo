[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  [redirects.query]
    lang = "en"

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
