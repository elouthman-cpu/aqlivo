name: Unpack AQLIVO site

on:
  push:
    paths:
      - 'sitepart_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode site archive
        run: |
          cat sitepart_* > /tmp/aqlivo-site.tar.gz.b64
          rm -rf /tmp/aqlivo-site
          mkdir -p /tmp/aqlivo-site
          base64 -d /tmp/aqlivo-site.tar.gz.b64 | tar -xzf - -C /tmp/aqlivo-site
          rsync -a /tmp/aqlivo-site/ ./ --exclude='.git' --exclude='.github' --exclude='sitepart_*' --exclude='aqlivo_part_*'
      - name: Commit site files
        run: |
          git config user.name "AQLIVO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync full AQLIVO site"
            git push
          fi
