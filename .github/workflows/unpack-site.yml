name: Unpack AQLIVO site

on:
  push:
    paths:
      - 'sitepart_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and decode site archive
        run: |
          python - <<'PY'
          from pathlib import Path
          parts = []
          for i in range(10):
              parts.append(Path(f"sitepart_{i:02d}").read_text())
          tail = Path("sitepart_10").read_text()
          # The transport dropped one four-character base64 block from the final chunk.
          if len(tail) == 916:
              tail = tail[:900] + "0iu9" + tail[900:]
          parts.append(tail)
          Path('/tmp/aqlivo-site.tar.gz.b64').write_text(''.join(parts))
          PY
          rm -rf /tmp/aqlivo-site
          mkdir -p /tmp/aqlivo-site
          base64 -d /tmp/aqlivo-site.tar.gz.b64 | tar -xzf - -C /tmp/aqlivo-site
          rsync -a /tmp/aqlivo-site/ ./ --exclude='.git' --exclude='.github' --exclude='sitepart_*' --exclude='aqlivo_part_*'
      - name: Commit site files
        run: |
          git config user.name "AQLIVO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync full AQLIVO site"
            git push
          fi
